<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match Monitor</title><style>
:root{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:#1d2939;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f0;padding:18px max(18px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}small,.muted{color:#697586}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:15px;padding:23px;margin-bottom:20px;box-shadow:0 2px 12px #18223008}h2{font-size:17px;margin:0 0 17px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}input,select,textarea{width:100%;border:1px solid #cfd6e0;border-radius:9px;padding:10px 12px;font:inherit;background:white;color:#1d2939}textarea{min-height:150px;font-family:monospace;font-size:12px}button{border:0;border-radius:9px;padding:11px 16px;background:#215bdd;color:white;font-weight:600;cursor:pointer}button.subtle{background:#eef3ff;color:#215bdd}button.danger{background:#fff0f0;color:#a12828}button:disabled{opacity:.5}button+button{margin-left:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{font-size:12px;border-radius:20px;background:#e8f2ff;padding:5px 9px;color:#2554a6}.task{border-top:1px solid #e9edf2;padding:16px 0}.task:first-child{border-top:0}.stats{display:flex;gap:20px;flex-wrap:wrap}.stat{background:#f6f8fb;border-radius:9px;padding:12px 14px;min-width:125px}.stat strong{display:block;font-size:21px;margin-top:3px}.errors{color:#ae2626;white-space:pre-wrap}.notice{color:#475467;font-size:13px;line-height:1.6}@media(max-width:740px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}header{padding:15px 18px}.card{padding:17px}}</style></head>
<body><header><div><h1>⚽ Match Monitor</h1><small>赛事监测与竞彩投注管理</small></div><span class="pill" id="health">连接中</span></header>
<main class="wrap"><div class="grid"><section class="card"><h2>查找比赛</h2><label>比赛日期（北京时间）</label><input type="date" id="date"><label>球队名称（中英文按API名称匹配）</label><input id="search" placeholder="Napoli / Glimt"><p><button id="find">搜索比赛</button></p><div id="fixtures"></div></section>
<section class="card"><h2>创建监测任务</h2><p class="notice" id="selected">请先在左侧搜索并选择比赛</p><label>开始监测（北京时间）</label><input type="datetime-local" id="start"><label>监测间隔（分钟）</label><select id="interval"><option>5</option><option selected>10</option><option>15</option><option>30</option><option>60</option></select><label>竞彩比分投注JSON（可以暂不填写）</label><textarea id="tickets" placeholder='[{"selection":"3:0","stake":26,"odds":14},{"selection":"胜其他","stake":18,"odds":26}]'></textarea><p class="notice">支持含 tickets 字段的JSON对象，或纯数组；赔率以实际出票SP为准。</p><button id="create">创建监测</button><p class="errors" id="createError"></p></section></div>
<section class="card"><div class="row"><h2>监测任务</h2><button class="subtle" id="refresh">刷新</button></div><div class="stats"><div class="stat">API今日使用<strong id="used">—</strong></div><div class="stat">任务数量<strong id="count">—</strong></div></div><div id="tasks"></div></section><p class="notice">首版只提供赛事监测与投注结果计算，不提供投注下单。所有时间以北京时间展示。只有创建在此管理台的任务才会显示；旧版单场服务仍独立运行。</p></main>
<script>
const $=id=>document.getElementById(id);let selected=null;const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const local=d=>d?new Date(d).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false}):"—";
async function req(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});if(!r.ok){let x;try{x=await r.json()}catch{x={detail:r.statusText}}throw Error(JSON.stringify(x.detail))}return r.json()}
const now=new Date(Date.now()+8*3600000).toISOString().slice(0,10);$("date").value=now;$("start").value=now+"T04:30";
$("find").onclick=async()=>{const holder=$("fixtures");holder.textContent="查询中…";try{const rows=await req("/api/fixtures?date="+encodeURIComponent($("date").value)+"&q="+encodeURIComponent($("search").value));holder.replaceChildren();if(!rows.length){holder.textContent="未找到符合条件的比赛";return}for(const item of rows){const p=document.createElement("div");p.className="task";p.innerHTML="<div><b>"+esc(item.home)+" vs "+esc(item.away)+"</b></div><small>"+esc(local(item.kickoff))+" · "+esc(item.status)+" · ID "+item.id+"</small><p></p>";const b=document.createElement("button");b.className="subtle";b.textContent="选择比赛";b.onclick=()=>{selected=item;$("selected").textContent=item.home+" vs "+item.away+" · ID "+item.id};p.lastChild.append(b);holder.append(p)}}catch(e){holder.textContent="查询失败："+e.message}};
function readTickets(){const raw=$("tickets").value.trim();if(!raw)return [];const v=JSON.parse(raw);return Array.isArray(v)?v:v.tickets}
$("create").onclick=async()=>{if(!selected){$("createError").textContent="请先选择比赛";return}try{const raw=$("start").value;if(!raw)throw Error("请选择开始时间");const date=new Date(raw+"+08:00");if(isNaN(date))throw Error("时间格式错误");const body={fixture_id:selected.id,home:selected.home,away:selected.away,start_at:date.toISOString(),interval_minutes:Number($("interval").value),tickets:readTickets()};if(!Array.isArray(body.tickets))throw Error("tickets 必须是数组");await req("/api/tasks",{method:"POST",body:JSON.stringify(body)});$("createError").textContent="";await refresh()}catch(e){$("createError").textContent=e.message}};
async function update(id,action){try{await req("/api/tasks/"+id+"/"+action,{method:"POST"});refresh()}catch(e){alert(e.message)}}
async function edit(id){const input=prompt("粘贴新的投注JSON数组或包含tickets字段的对象");if(input===null)return;try{const v=JSON.parse(input),tickets=Array.isArray(v)?v:v.tickets;if(!Array.isArray(tickets))throw Error("无效JSON票据");await req("/api/tasks/"+id+"/tickets",{method:"PUT",body:JSON.stringify(tickets)});refresh()}catch(e){alert(e.message)}}
async function refresh(){try{const [health,usage,tasks]=await Promise.all([req("/api/health"),req("/api/usage"),req("/api/tasks")]);$("health").textContent=health.poller?"后台监测已开启":"管理界面模式";$("used").textContent=usage.used+"/"+usage.budget;$("count").textContent=tasks.length;$("tasks").replaceChildren();for(const t of tasks){const box=document.createElement("div");box.className="task";box.innerHTML="<div class=row><b>"+esc(t.home)+" vs "+esc(t.away)+"</b><span class=pill>"+esc(t.status)+"</span></div><p class=notice>比分："+esc(t.last_score||"待首次查询")+" · 开始："+esc(local(t.start_at))+" · 频率："+t.interval_minutes+"分钟 · 最近查询："+esc(local(t.last_check))+"</p><p class=notice>投注 "+t.tickets.length+" 项 / 合计 ¥"+t.tickets.reduce((a,b)=>a+Number(b.stake||0),0)+"</p>"+(t.error?"<p class=errors>"+esc(t.error)+"</p>":"");const actions=document.createElement("div");for(const [title,fn,cl] of [["编辑投注",()=>edit(t.id),"subtle"],["暂停",()=>update(t.id,"pause"),"subtle"],["恢复",()=>update(t.id,"resume"),"subtle"],["停止",()=>update(t.id,"stop"),"danger"]]){const b=document.createElement("button");b.textContent=title;b.className=cl;b.onclick=fn;actions.append(b)}box.append(actions);$("tasks").append(box)}}catch(e){$("health").textContent="服务异常";$("tasks").textContent=e.message}}
$("refresh").onclick=refresh;refresh();setInterval(refresh,30000);
</script></body></html>
